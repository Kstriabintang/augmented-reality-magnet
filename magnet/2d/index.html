<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi 2D Medan Magnet | adindautami</title>
<meta name="description" content="Simulasi medan magnet 2D interaktif: garis gaya magnet untuk magnet tunggal, tarik-menarik (N–S), dan tolak-menolak (N–N).">
<meta name="theme-color" content="#fdeef0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ink:#16233d; --sub:#5b6b85; --bg1:#fdeef0; --bg2:#f2dbe4; --card:#ffffff;
  --line:#f2dbe1; --clay-lo:#eec4cf; --n:#e8462f; --n2:#ff7a5c; --s:#2f6fd0; --s2:#63a0ee;
  --stage1:#eef5ff; --stage2:#dbe7fb;
  --shadow:0 10px 0 -2px var(--clay-lo),0 20px 36px rgba(110,31,58,.16);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 12px 22px rgba(110,31,58,.14);
}
:root[data-theme="gelap"]{
  --ink:#f6eaf1; --sub:#d2b0bf; --bg1:#3a1322; --bg2:#180710; --card:#2a141d;
  --line:#4a2833; --clay-lo:#1a0a12; --stage1:#182a4a; --stage2:#0b1526;
  --shadow:0 10px 0 -2px var(--clay-lo),0 22px 40px rgba(0,0,0,.5);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 14px 26px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--font-b); font-weight:600; color:var(--ink); min-height:100vh; -webkit-tap-highlight-color:transparent;
  background:radial-gradient(55% 40% at 88% 6%, rgba(232,70,47,.12), transparent 60%), radial-gradient(140% 110% at 50% 0%, var(--bg1), var(--bg2) 74%)}
.wrap{max-width:820px; margin:0 auto; padding:16px clamp(14px,4vw,26px) 60px}
header{display:flex; align-items:center; gap:12px}
.ic,.tbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .12s}
.ic:active,.tbtn:active{transform:translateY(2px)}
.ic svg,.tbtn svg{width:22px;height:22px}
.ic svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg{fill:currentColor}
.title{font-family:var(--font-d);font-weight:800;font-size:19px;display:flex;align-items:center;gap:9px}
.title .b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--n2),var(--n))}
.title .b svg{width:17px;height:17px;fill:#fff}
.title .tag{font-family:var(--font-d);font-weight:800;font-size:11px;color:var(--s);background:rgba(47,111,208,.14);padding:3px 9px;border-radius:999px}
.spacer{flex:1}
.stage{position:relative; margin-top:14px; height:min(58vh,500px); border-radius:24px; overflow:hidden; border:3px solid rgba(255,255,255,.5);
  background:radial-gradient(120% 120% at 50% 8%, var(--stage1), var(--stage2)); box-shadow:var(--shadow)}
:root[data-theme="gelap"] .stage{border-color:rgba(255,255,255,.1)}
.stage svg{position:absolute; inset:0; width:100%; height:100%}
.hintline{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:var(--sub);font-size:12.5px;font-weight:700;pointer-events:none}
.modes{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap}
.mbtn{flex:1; min-width:150px; display:flex; flex-direction:column; gap:2px; align-items:flex-start; cursor:pointer; padding:12px 15px; border-radius:16px;
  border:2.5px solid var(--line); background:var(--card); color:inherit; box-shadow:var(--shadow-sm); transition:transform .12s, border-color .12s}
.mbtn:active{transform:translateY(1px)}
.mbtn b{font-family:var(--font-d); font-weight:800; font-size:14.5px}
.mbtn span{font-size:12px; font-weight:600; color:var(--sub)}
.mbtn.on{border-color:var(--n); box-shadow:0 0 0 3px rgba(232,70,47,.16)}
.panel{margin-top:16px; background:var(--card); border:2.5px solid var(--line); border-radius:22px; box-shadow:var(--shadow-sm); padding:18px 20px}
.panel h2{font-family:var(--font-d); font-weight:800; font-size:17px; margin:0 0 8px}
.panel p{margin:0; color:var(--sub); font-size:13.5px; line-height:1.6; font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;font-weight:700}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid currentColor;vertical-align:middle;margin-right:6px;border-radius:2px}
.lg-n{color:var(--n)} .lg-s{color:var(--s)}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:13px;font-weight:700}
footer a{color:var(--n);font-weight:800;text-decoration:none}
:root[data-theme="gelap"] footer a{color:var(--n2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="ic" href="/magnet/" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title"><span class="b"><svg viewBox="0 0 24 24"><path d="M5 4h4v6a3 3 0 0 0 6 0V4h4v6a8 8 0 0 1-16 0V4z"/></svg></span>Medan Magnet <span class="tag">2D</span></div>
    <div class="spacer"></div>
    <button class="tbtn" id="theme" type="button" aria-label="Mode terang atau gelap"></button>
  </header>

  <div class="stage">
    <svg id="field" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" aria-label="Garis gaya medan magnet"></svg>
    <div class="hintline">Garis gaya magnet keluar dari kutub Utara (N) menuju kutub Selatan (S)</div>
  </div>

  <div class="modes" id="modes">
    <button class="mbtn on" data-mode="single"><b>Magnet Tunggal</b><span>Satu batang N–S + garis gaya</span></button>
    <button class="mbtn" data-mode="attract"><b>Tarik-menarik (N–S)</b><span>Kutub berbeda berhadapan</span></button>
    <button class="mbtn" data-mode="repel"><b>Tolak-menolak (N–N)</b><span>Kutub sama berhadapan</span></button>
  </div>

  <div class="panel">
    <h2 id="p-title">Magnet Tunggal</h2>
    <p id="p-text"></p>
    <div class="legend">
      <span class="lg-n"><i></i>Keluar dari kutub Utara (N)</span>
      <span class="lg-s"><i></i>Masuk ke kutub Selatan (S)</span>
    </div>
  </div>

  <footer>Media ajar IPA · <a href="/magnet/">Medan Magnet</a></footer>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('field');
const W=800,H=520,CY=260;
const TEXT={
  single:{title:'Magnet Tunggal',text:'Setiap magnet memiliki dua kutub: Utara (N) dan Selatan (S). Garis gaya magnet selalu keluar dari kutub Utara dan masuk ke kutub Selatan. Garis paling rapat berada di dekat kutub — di situlah gaya magnet paling kuat.'},
  attract:{title:'Tarik-menarik (N–S)',text:'Dua kutub yang berbeda (Utara dan Selatan) saling berhadapan. Garis gaya menyambung dari kutub Utara satu magnet ke kutub Selatan magnet lainnya — kedua magnet saling tarik-menarik.'},
  repel:{title:'Tolak-menolak (N–N)',text:'Dua kutub yang sama (Utara dan Utara) saling berhadapan. Garis gaya saling menekan dan membelok menjauh dari celah — kedua magnet saling tolak-menolak.'},
};

// ---- konfigurasi muatan kutub per mode (N=+1, S=-1) ----
function config(mode){
  if(mode==='single') return { charges:[{x:320,y:CY,q:1},{x:480,y:CY,q:-1}],
    bars:[{x:320,y:CY-28,w:160,h:56,left:'N',right:'S'}], single:true };
  if(mode==='attract') return { charges:[{x:210,y:CY,q:1},{x:330,y:CY,q:-1},{x:470,y:CY,q:1},{x:590,y:CY,q:-1}],
    bars:[{x:210,y:CY-26,w:120,h:52,left:'N',right:'S'},{x:470,y:CY-26,w:120,h:52,left:'N',right:'S'}] };
  // repel: kutub dalam sama-sama N
  return { charges:[{x:210,y:CY,q:-1},{x:330,y:CY,q:1},{x:470,y:CY,q:1},{x:590,y:CY,q:-1}],
    bars:[{x:210,y:CY-26,w:120,h:52,left:'S',right:'N'},{x:470,y:CY-26,w:120,h:52,left:'N',right:'S'}] };
}

// medan B di titik (x,y): jumlah kontribusi tiap muatan
function fieldAt(x,y,ch){
  let bx=0,by=0;
  for(const c of ch){ const dx=x-c.x, dy=y-c.y; let r2=dx*dx+dy*dy; if(r2<64)r2=64; const r=Math.sqrt(r2); const inv=c.q/(r2*r); bx+=dx*inv; by+=dy*inv; }
  return [bx,by];
}
// telusuri satu garis gaya dari titik seed searah medan; berhenti dekat kutub S / keluar batas
function trace(x,y,ch,dir){
  const pts=[[x,y]]; const step=3.2;
  for(let i=0;i<600;i++){
    const [bx,by]=fieldAt(x,y,ch); const m=Math.hypot(bx,by); if(m<1e-9)break;
    x+=dir*step*bx/m; y+=dir*step*by/m;
    if(x<-40||x>W+40||y<-40||y>H+40)break;
    // dekat kutub negatif → selesai
    let stop=false; for(const c of ch){ if(c.q<0 && Math.hypot(x-c.x,y-c.y)<9){ pts.push([c.x,c.y]); stop=true; break; } }
    pts.push([x,y]); if(stop)break;
  }
  return pts;
}
function pathD(pts){ return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '); }

function addLine(g,d,arrowAt){
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke','url(#fl)');
  p.setAttribute('stroke-width','2.2'); p.setAttribute('stroke-linecap','round'); p.setAttribute('opacity','.85');
  g.appendChild(p);
  if(arrowAt){ const [ax,ay,ang]=arrowAt; const s=5;
    const ar=document.createElementNS(NS,'path');
    ar.setAttribute('d',`M${ax} ${ay} L${(ax-s*Math.cos(ang-.5)).toFixed(1)} ${(ay-s*Math.sin(ang-.5)).toFixed(1)} L${(ax-s*Math.cos(ang+.5)).toFixed(1)} ${(ay-s*Math.sin(ang+.5)).toFixed(1)} Z`);
    ar.setAttribute('fill','#8a5a8a'); ar.setAttribute('opacity','.75'); g.appendChild(ar); }
}
// lengkung dipol simetris untuk magnet tunggal (loop N→S atas & bawah, ala diagram baku)
function singleArcs(g){
  const Nx=320, Sx=480, cx=(Nx+Sx)/2;
  const loops=[{h:38,dx:6},{h:78,dx:22},{h:126,dx:46},{h:182,dx:78},{h:246,dx:118}];
  for(const {h,dx} of loops){
    for(const dir of [-1,1]){ // atas & bawah
      const d=`M${Nx} ${CY} C ${Nx-dx} ${CY+dir*h*0.9}, ${Sx+dx} ${CY+dir*h*0.9}, ${Sx} ${CY}`;
      addLine(g,d,[cx, CY+dir*h*0.675, 0]); // panah di puncak lengkung menghadap S (kanan)
    }
  }
}

function render(mode){
  const cfg=config(mode); const {charges,bars}=cfg;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const defs=document.createElementNS(NS,'defs');
  defs.innerHTML='<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8462f"/><stop offset="1" stop-color="#2f6fd0"/></linearGradient>';
  svg.appendChild(defs);
  const gLines=document.createElementNS(NS,'g');
  if(cfg.single){
    singleArcs(gLines);
  } else {
    const seedsN=[ -0.72,-0.46,-0.22,0,0.22,0.46,0.72, Math.PI-0.72,Math.PI-0.46,Math.PI-0.22,Math.PI,Math.PI+0.22,Math.PI+0.46,Math.PI+0.72 ];
    for(const c of charges){ if(c.q<=0) continue;
      for(const a of seedsN){
        const sx=c.x+13*Math.cos(a), sy=c.y+13*Math.sin(a);
        const pts=trace(sx,sy,charges,1);
        if(pts.length<4) continue;
        let arrow=null;
        if(pts.length>18){ const k=Math.floor(pts.length*0.5); const [ax,ay]=pts[k],[bx,by]=pts[k+1]||pts[k]; arrow=[ax,ay,Math.atan2(by-ay,bx-ax)]; }
        addLine(gLines,pathD(pts),arrow);
      }
    }
  }
  svg.appendChild(gLines);
  // gambar batang magnet
  for(const b of bars){
    const g=document.createElementNS(NS,'g');
    const half=b.w/2;
    const r1=document.createElementNS(NS,'rect'); r1.setAttribute('x',b.x); r1.setAttribute('y',b.y); r1.setAttribute('width',half); r1.setAttribute('height',b.h); r1.setAttribute('rx',9);
    r1.setAttribute('fill', b.left==='N'?'#e8462f':'#2f6fd0');
    const r2=document.createElementNS(NS,'rect'); r2.setAttribute('x',b.x+half); r2.setAttribute('y',b.y); r2.setAttribute('width',half); r2.setAttribute('height',b.h); r2.setAttribute('rx',9);
    r2.setAttribute('fill', b.right==='N'?'#e8462f':'#2f6fd0');
    r2.setAttribute('transform','translate(0,0)');
    g.appendChild(r1); g.appendChild(r2);
    const t1=document.createElementNS(NS,'text'); t1.setAttribute('x',b.x+half/2); t1.setAttribute('y',b.y+b.h/2+8); t1.setAttribute('text-anchor','middle'); t1.setAttribute('fill','#fff'); t1.setAttribute('font-family','Baloo 2,sans-serif'); t1.setAttribute('font-weight','800'); t1.setAttribute('font-size','24'); t1.textContent=b.left;
    const t2=document.createElementNS(NS,'text'); t2.setAttribute('x',b.x+half+half/2); t2.setAttribute('y',b.y+b.h/2+8); t2.setAttribute('text-anchor','middle'); t2.setAttribute('fill','#fff'); t2.setAttribute('font-family','Baloo 2,sans-serif'); t2.setAttribute('font-weight','800'); t2.setAttribute('font-size','24'); t2.textContent=b.right;
    g.appendChild(t1); g.appendChild(t2);
    svg.appendChild(g);
  }
  document.getElementById('p-title').textContent=TEXT[mode].title;
  document.getElementById('p-text').textContent=TEXT[mode].text;
}

document.getElementById('modes').addEventListener('click',e=>{ const b=e.target.closest('.mbtn'); if(!b)return;
  document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x===b)); render(b.dataset.mode); });
render('single');

// tema
(function(){ var KEY='adindautami-theme', root=document.documentElement, btn=document.getElementById('theme');
  var MOON='<svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 1 1-10-10 8 8 0 0 0 10 10z"/></svg>';
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g></svg>';
  function get(){ try{return localStorage.getItem(KEY)||'terang'}catch(e){return 'terang'} }
  function apply(t){ root.setAttribute('data-theme', t); btn.innerHTML=t==='gelap'?SUN:MOON; }
  apply(get()); btn.addEventListener('click',function(){ var t=get()==='gelap'?'terang':'gelap'; try{localStorage.setItem(KEY,t)}catch(e){} apply(t); });
})();
</script>
</body>
</html>
