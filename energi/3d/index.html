<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformasi Energi 3D — Media Ajar IPA | adindautami</title>
<meta name="description" content="Penampil 3D transformasi energi: baterai & smartphone, panel surya, kendaraan, fotosintesis, PLTA, PLTU — putar bebas, ikuti tahap perubahan energi dengan label dan narasi.">
<meta name="theme-color" content="#eaf2ff">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Transformasi Energi 3D — Media Ajar IPA">
<meta property="og:description" content="Putar 6 adegan transformasi energi dalam 3D, tahap demi tahap.">
<meta property="og:image" content="https://utamiii.my.id/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ink:#16233d; --sub:#5b6b85; --bg1:#eaf2ff; --bg2:#dbe7fb; --card:#ffffff;
  --line:#dbe6f7; --clay-lo:#c4d5ef; --en:#1c8a4b; --en2:#5ad48d;
  --stage1:#dfeafd; --stage2:#bcd2f2;
  --shadow:0 10px 0 -2px var(--clay-lo),0 20px 36px rgba(31,58,110,.16);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 12px 22px rgba(31,58,110,.14);
}
:root[data-theme="gelap"]{
  --ink:#eaf1fb; --sub:#9fb2d2; --bg1:#13223f; --bg2:#070d18; --card:#152036;
  --line:#28374f; --clay-lo:#0a1424; --stage1:#16294a; --stage2:#0a1324;
  --shadow:0 10px 0 -2px var(--clay-lo),0 22px 40px rgba(0,0,0,.5);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 14px 26px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--font-b); font-weight:600; color:var(--ink); min-height:100vh; -webkit-tap-highlight-color:transparent;
  background:radial-gradient(55% 40% at 90% 4%, rgba(28,138,75,.13), transparent 60%), radial-gradient(140% 110% at 50% 0%, var(--bg1), var(--bg2) 74%) fixed}
.bar{display:flex; align-items:center; gap:12px; max-width:940px; margin:0 auto; padding:max(12px,env(safe-area-inset-top)) clamp(14px,4vw,26px) 8px}
.ic,.tbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .12s;flex:0 0 auto}
.ic:active,.tbtn:active{transform:translateY(2px)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg{width:22px;height:22px;fill:currentColor}
.title{font-family:var(--font-d); font-weight:800; font-size:16.5px; display:flex; align-items:center; gap:9px; min-width:0}
.title .b{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--en2),var(--en));flex:0 0 auto}
.title .b svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.title span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title .tag{font-family:var(--font-d);font-weight:800;font-size:11px;letter-spacing:.5px;color:#2f6fd0;background:rgba(47,111,208,.12);border:2px solid rgba(47,111,208,.28);padding:2px 9px;border-radius:999px;flex:0 0 auto}
.spacer{flex:1}
.wrap{max-width:940px; margin:0 auto; padding:4px clamp(14px,4vw,26px) 64px}
/* chips pemilih materi */
.chips{display:flex; gap:8px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.mchip{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:var(--font-d); font-weight:800; font-size:12.5px;
  color:var(--sub); background:var(--card); border:2px solid var(--line); border-radius:999px; padding:7px 13px; text-decoration:none; box-shadow:var(--shadow-sm)}
.mchip .em{font-size:14px}
.mchip.on{color:#08351a; background:linear-gradient(160deg,#7ef0b0,#22a758); border-color:rgba(255,255,255,.4)}
:root[data-theme="gelap"] .mchip.on{color:#08351a}
.stage{position:relative; height:min(60vh,540px); border-radius:24px; overflow:hidden; border:3px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow); background:radial-gradient(120% 100% at 50% 0%, var(--stage1), var(--stage2)); touch-action:none; cursor:grab}
:root[data-theme="gelap"] .stage{border-color:rgba(255,255,255,.1)}
.stage:active{cursor:grabbing}
.stage canvas{display:block}
.hint{position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:12.5px; font-weight:700; color:var(--sub); pointer-events:none; text-shadow:0 1px 2px rgba(255,255,255,.5); z-index:2}
:root[data-theme="gelap"] .hint{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tools{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:8px; z-index:3}
.tbtn.mini{width:40px;height:40px;border-radius:12px}
.tbtn.mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.mini.on{color:#fff;background:linear-gradient(160deg,#63a0ee,#2f6fd0);border-color:transparent}
/* label 3D */
.clabel{font-family:var(--font-d); font-weight:800; font-size:11.5px; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:9px; padding:3px 9px; box-shadow:var(--shadow-sm); white-space:nowrap; transform:translateY(-4px); opacity:.96}
.clabel.tlab{border-color:rgba(255,255,255,.45)}
/* rantai energi di dalam stage */
.chain{position:absolute; left:50%; transform:translateX(-50%); top:10px; display:flex; align-items:center; gap:5px; z-index:3;
  max-width:calc(100% - 110px); overflow-x:auto; scrollbar-width:none; padding:6px 10px; border-radius:999px; background:var(--card); box-shadow:var(--shadow-sm); white-space:nowrap}
.chain::-webkit-scrollbar{display:none}
.cpill{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-d); font-weight:800; font-size:10.5px; color:var(--sub); padding:3px 8px; border-radius:999px; transition:all .35s}
.cpill svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.car{color:var(--sub); opacity:.5; font:800 10.5px var(--font-d); transition:color .3s}
.car.on{opacity:1; color:#c47d0a}
/* tombol tahap */
.controls{display:flex; align-items:stretch; gap:10px; margin-top:16px; flex-wrap:wrap}
.stgroup{display:flex; gap:8px; padding:7px; border-radius:18px; background:var(--card); border:2.5px solid var(--line); box-shadow:var(--shadow-sm); overflow-x:auto; scrollbar-width:none; flex:1; justify-content:safe center}
.stgroup::-webkit-scrollbar{display:none}
.stbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:62px; max-width:116px; height:58px; border-radius:13px; flex:1 0 auto;
  border:2px solid transparent; background:transparent; color:var(--sub); cursor:pointer; font:800 10.5px var(--font-d); padding:0 10px}
.stbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.stbtn .no{position:absolute; top:3px; right:5px; font-size:9px; opacity:.7}
.stbtn.on{border-color:rgba(255,255,255,.35); color:var(--tc); background:linear-gradient(160deg,var(--c1),var(--c2)); box-shadow:0 5px 14px rgba(31,58,110,.28)}
.nextbtn{display:inline-flex; align-items:center; gap:8px; padding:0 20px; border-radius:18px; border:2px solid rgba(255,255,255,.35); cursor:pointer;
  font:800 14.5px var(--font-d); color:#08351a; background:linear-gradient(160deg,#7ef0b0,#22a758); box-shadow:0 6px 0 -1px #157a3d,0 12px 20px rgba(34,167,88,.35); transition:transform .12s}
.nextbtn:active{transform:translateY(3px)}
.nextbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* narasi */
.narasi{display:none; margin-top:14px; background:var(--card); border:2.5px solid var(--line); border-radius:20px; box-shadow:var(--shadow-sm); padding:15px 17px}
.narasi.show{display:block}
.narasi .nhead{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.narasi h2{margin:0; flex:1; font:800 15px var(--font-d); color:var(--en)}
:root[data-theme="gelap"] .narasi h2{color:var(--en2)}
.nbtn{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.nbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nbtn.off{opacity:.4}
.nbtn.off .wave{display:none}
.narasi p{margin:0; font-size:13.5px; line-height:1.55; font-weight:700}
.narasi .sub{margin-top:6px; font-size:12px; line-height:1.5; color:var(--sub); font-weight:700}
/* kecepatan + info */
.speedrow{display:flex; align-items:center; gap:10px; margin-top:14px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 14px; box-shadow:var(--shadow-sm); max-width:340px}
.speedrow label{font-family:var(--font-d); font-weight:700; font-size:13px; white-space:nowrap}
.speedrow input{flex:1; accent-color:var(--en)}
.speedrow b{font-family:var(--font-d); min-width:40px; text-align:right; color:var(--en)}
:root[data-theme="gelap"] .speedrow b{color:var(--en2)}
.inforow{margin-top:14px; font-family:var(--font-d); font-weight:800; font-size:12.5px; color:var(--sub); background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:10px 14px; overflow-x:auto; white-space:nowrap; scrollbar-width:none}
.inforow::-webkit-scrollbar{display:none}
.inforow b{color:var(--en)} :root[data-theme="gelap"] .inforow b{color:var(--en2)}
@media (prefers-reduced-motion:reduce){ .nextbtn,.ic,.tbtn{transition:none} }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }
</script>
</head>
<body>
  <div class="bar">
    <a class="ic" href="/energi/" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title"><span class="b"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 3v5h-5"/></svg></span> <span class="t" id="ttl">Transformasi Energi</span> <span class="tag">3D</span></div>
    <div class="spacer"></div>
    <button class="tbtn" id="theme" type="button" aria-label="Mode terang atau gelap"></button>
  </div>

  <div class="wrap">
    <nav class="chips" id="chips" aria-label="Pilih materi"></nav>

    <div class="stage" id="stage">
      <div class="chain" id="chain" aria-hidden="true"></div>
      <div class="tools">
        <button class="tbtn mini" id="rot" type="button" title="Putar otomatis" aria-label="Putar otomatis"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      </div>
      <div class="hint">Seret memutar · cubit/scroll zoom · ketuk objek = tahap berikutnya</div>
    </div>

    <div class="controls">
      <div class="stgroup" id="stgroup"></div>
      <button class="nextbtn" id="next" type="button">Tahap<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>

    <div class="narasi" id="narasi">
      <div class="nhead">
        <h2 id="nartitle"></h2>
        <button class="nbtn" id="narspeak" type="button" title="Narasi suara" aria-label="Narasi suara"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button class="nbtn" id="narclose" type="button" title="Tutup" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="nartext"></p>
      <div class="sub" id="narsub"></div>
    </div>

    <div class="inforow">Alur: <b id="info"></b></div>

    <div class="speedrow">
      <label>Kecepatan animasi</label>
      <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1">
      <b id="speedv">1×</b>
    </div>
  </div>

<script>
(function(){ var KEY='adindautami-theme',t='terang'; try{t=localStorage.getItem(KEY)||'terang'}catch(e){} document.documentElement.setAttribute('data-theme',t); })();
</script>
<script type="module" src="/js/energi3d.js?v=1"></script>
</body>
</html>
