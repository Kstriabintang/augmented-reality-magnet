<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AR Transformasi Energi — adindautami</title>
<meta name="description" content="Lihat perubahan bentuk energi lewat kamera HP: baterai & smartphone, panel surya, kendaraan bermotor, fotosintesis, PLTA, dan PLTU — tahap demi tahap dengan label & narasi suara.">
<meta name="theme-color" content="#0a0f1a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --font-b:"Nunito",system-ui,sans-serif; --en:#22a758; --en2:#7ef0b0; }
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--font-b);font-weight:700;background:#0a0f1a;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#0a0f1a}
#stage{position:fixed;inset:0;z-index:1;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.overlay{position:fixed;inset:0;z-index:2;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(to bottom,rgba(6,10,20,.65),transparent)}
.topbar>*{pointer-events:auto}
.ic{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(16,22,36,.6);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;text-decoration:none;cursor:pointer;flex:0 0 auto}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{margin-left:auto;font-family:var(--font-d);font-weight:800;color:#fff;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chips pemilih materi */
.chips{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top));display:flex;gap:7px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.mchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font-d);font-weight:800;font-size:12px;color:#c7d3e8;
  background:rgba(16,22,36,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 12px;text-decoration:none}
.mchip .em{font-size:13px}
.mchip.on{color:#08351a;background:linear-gradient(160deg,var(--en2),var(--en));border-color:rgba(255,255,255,.35)}
/* rantai energi */
.chain{position:absolute;left:50%;transform:translateX(-50%);top:calc(106px + env(safe-area-inset-top));display:flex;align-items:center;gap:5px;
  max-width:94vw;overflow-x:auto;scrollbar-width:none;padding:6px 11px;border-radius:999px;background:rgba(10,16,28,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);pointer-events:none;white-space:nowrap}
.chain::-webkit-scrollbar{display:none}
.cpill{display:inline-flex;align-items:center;gap:4px;font:800 11px var(--font-d);color:#6b7891;padding:3.5px 8px;border-radius:999px;transition:all .35s}
.cpill svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.car{color:#3d4a63;font:800 11px var(--font-d);transition:color .35s}
.car.on{color:#ffd77e}
/* info singkat */
.inforow{position:absolute;left:50%;transform:translateX(-50%);top:calc(148px + env(safe-area-inset-top));max-width:92vw;
  font:800 10.5px var(--font-d);color:#a9b8d4;background:rgba(10,16,28,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:5px 12px;pointer-events:none;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.inforow::-webkit-scrollbar{display:none}
/* label 3D di atas video */
.clabel{font-family:var(--font-d);font-weight:800;font-size:11px;color:#fff;background:rgba(16,22,36,.72);border:1.5px solid rgba(255,255,255,.22);border-radius:9px;padding:3px 8px;white-space:nowrap;transform:translateY(-4px)}
.clabel.tlab{border-color:rgba(255,255,255,.45)}
.perm{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#dbe6f8;padding:30px;
  background:radial-gradient(120% 120% at 50% 0%,#1a2740,#0a0f1a 70%)}
.perm .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--en);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.perm b{font-family:var(--font-d);font-size:18px;color:#fff}
.hint{position:absolute;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom));text-align:center;color:#eaf1fb;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.6);padding:0 20px}
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 10px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(6,10,20,.7),transparent)}
.dock>*{pointer-events:auto}
.round{width:50px;height:50px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(16,22,36,.62);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.round svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.stgroup{display:flex;gap:7px;padding:7px;border-radius:20px;background:rgba(16,22,36,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);
  max-width:calc(100vw - 140px);overflow-x:auto;scrollbar-width:none}
.stgroup::-webkit-scrollbar{display:none}
.stbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:58px;height:56px;border-radius:14px;flex:0 0 auto;
  border:2px solid transparent;background:transparent;color:#c7d3e8;cursor:pointer;font:800 10px var(--font-d);padding:0 6px}
.stbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.stbtn .no{position:absolute;top:2px;right:4px;font-size:9px;opacity:.75}
.stbtn.on{border-color:rgba(255,255,255,.35);color:var(--tc);background:linear-gradient(160deg,var(--c1),var(--c2))}
/* panel narasi */
.narasi{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));
  width:min(94vw,540px);padding:13px 15px 12px;border-radius:20px;background:rgba(10,16,28,.78);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.16);color:#eaf1fb;pointer-events:auto}
.narasi.show{display:block}
.narasi .nhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.narasi h2{margin:0;flex:1;font:800 14px var(--font-d);color:var(--en2)}
.nbtn{width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#dbe6f8;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.nbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nbtn.off{opacity:.45}
.nbtn.off .wave{display:none}
.narasi p{margin:0;font-size:13px;line-height:1.5;font-weight:700}
.narasi .sub{margin-top:6px;font-size:11.5px;line-height:1.45;color:#a9b8d4;font-weight:700}
/* ---- seg mode Tanpa Marker / Marker ---- */
.seg{display:inline-flex;gap:3px;padding:4px;border-radius:13px;background:rgba(16,22,36,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)}
.seg button{font-family:var(--font-d);font-weight:800;font-size:12.5px;color:#c7d3e8;border:0;background:transparent;padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg .on{color:#08351a;background:linear-gradient(160deg,var(--en2),var(--en))}
/* ---- mode marker ---- */
#mstage{position:fixed;inset:0;z-index:1;display:none;background:#0a0f1a;overflow:hidden;touch-action:none}
body[data-mode="marker"] #mstage{display:block}
body[data-mode="marker"] #cam,body[data-mode="marker"] #stage{display:none}
.pillkartu{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(186px + env(safe-area-inset-top));
  pointer-events:auto;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;text-decoration:none;
  font:800 13px var(--font-d);color:#08351a;background:linear-gradient(160deg,var(--en2),var(--en));
  border:2px solid rgba(255,255,255,.35)}
.pillkartu svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
body[data-mode="marker"]:not(.found) .pillkartu{display:inline-flex}
.scanbox{display:none;position:absolute;left:50%;top:50%;width:min(66vw,340px);aspect-ratio:4/3;transform:translate(-50%,-46%);pointer-events:none}
.scanbox i{position:absolute;width:44px;height:44px;border:5px solid var(--en2);opacity:.95;border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
.scanbox i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:18px}
.scanbox i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:18px}
.scanbox i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:18px}
.scanbox i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:18px}
@keyframes pulse{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.45;transform:scale(.94)}}
body[data-mode="marker"]:not(.found) .scanbox{display:block}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }
</script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <div id="stage"></div>
  <div id="mstage"></div>

  <div class="perm" id="perm">
    <div class="spin"></div>
    <b>Menyalakan kamera…</b>
    <div>Izinkan akses kamera untuk memulai AR.</div>
  </div>

  <div class="overlay">
    <div class="topbar">
      <a class="ic" href="/energi/" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="seg">
        <button class="on" type="button" id="btnfree">Tanpa Marker</button>
        <button type="button" id="btnmarker">Marker</button>
      </div>
      <span class="title" id="ttl">Transformasi Energi</span>
    </div>

    <nav class="chips" id="chips" aria-label="Pilih materi"></nav>
    <div class="chain" id="chain" aria-hidden="true"></div>
    <div class="inforow" id="info"></div>

    <a class="pillkartu" href="/energi/ar/kartu/"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>Lihat Kartu Marker</a>
    <div class="scanbox"><i></i><i></i><i></i><i></i></div>

    <div class="narasi" id="narasi">
      <div class="nhead">
        <h2 id="nartitle"></h2>
        <button class="nbtn" id="narspeak" type="button" title="Narasi suara" aria-label="Narasi suara"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button class="nbtn" id="narclose" type="button" title="Tutup" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="nartext"></p>
      <div class="sub" id="narsub"></div>
    </div>

    <div class="hint" id="hint">Seret memutar · cubit zoom · <b>ketuk layar</b> untuk memulai perjalanan energi</div>

    <div class="dock">
      <button class="round" id="reset" type="button" title="Taruh ulang" aria-label="Taruh ulang"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <div class="stgroup" id="stgroup"></div>
      <button class="round" id="snap" type="button" title="Jepret foto" aria-label="Jepret foto"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
  </div>

<script type="module" src="/js/energiAR.js?v=3"></script>
</body>
</html>
