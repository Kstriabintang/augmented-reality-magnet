<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penampil 3D Medan Magnet | adindautami</title>
<meta name="description" content="Medan magnet 3 dimensi yang bisa diputar bebas: garis gaya mengelilingi magnet, tiga mode kutub (tunggal, tarik-menarik, tolak-menolak).">
<meta name="theme-color" content="#fdeef0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ink:#16233d; --sub:#5b6b85; --bg1:#fdeef0; --bg2:#f2dbe4; --card:#ffffff;
  --line:#f2dbe1; --clay-lo:#eec4cf; --n:#e8462f; --n2:#ff7a5c; --s:#2f6fd0; --s2:#63a0ee;
  --stage1:#eef5ff; --stage2:#dbe7fb;
  --shadow:0 10px 0 -2px var(--clay-lo),0 20px 36px rgba(110,31,58,.16);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 12px 22px rgba(110,31,58,.14);
}
:root[data-theme="gelap"]{
  --ink:#f6eaf1; --sub:#d2b0bf; --bg1:#3a1322; --bg2:#180710; --card:#2a141d;
  --line:#4a2833; --clay-lo:#1a0a12; --stage1:#182a4a; --stage2:#0b1526;
  --shadow:0 10px 0 -2px var(--clay-lo),0 22px 40px rgba(0,0,0,.5);
  --shadow-sm:0 6px 0 -2px var(--clay-lo),0 14px 26px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--font-b); font-weight:600; color:var(--ink); min-height:100vh; -webkit-tap-highlight-color:transparent;
  background:radial-gradient(55% 40% at 88% 6%, rgba(232,70,47,.12), transparent 60%), radial-gradient(140% 110% at 50% 0%, var(--bg1), var(--bg2) 74%)}
.bar{display:flex; align-items:center; gap:12px; max-width:900px; margin:0 auto; padding:16px clamp(14px,4vw,26px) 4px}
.ic,.tbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .12s}
.ic:active,.tbtn:active{transform:translateY(2px)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg{width:22px;height:22px;fill:currentColor}
.title{font-family:var(--font-d);font-weight:800;font-size:19px;display:flex;align-items:center;gap:9px}
.title .b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,var(--n2),var(--n))}
.title .b svg{width:17px;height:17px;fill:#fff}
.title .tag{font-family:var(--font-d);font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--n);background:rgba(232,70,47,.12);border:2px solid rgba(232,70,47,.28);padding:2px 9px;border-radius:999px}
.spacer{flex:1}
.wrap{max-width:900px; margin:0 auto; padding:4px clamp(14px,4vw,26px) 64px}
.stage{position:relative; height:min(64vh,560px); border-radius:24px; overflow:hidden; border:3px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow); background:radial-gradient(120% 100% at 50% 0%, var(--stage1), var(--stage2)); touch-action:none; cursor:grab}
:root[data-theme="gelap"] .stage{border-color:rgba(255,255,255,.1)}
.stage:active{cursor:grabbing}
.stage canvas{display:block}
.hint{position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:12.5px; font-weight:700; color:var(--sub); pointer-events:none; text-shadow:0 1px 2px rgba(255,255,255,.5)}
:root[data-theme="gelap"] .hint{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.clabel{font-family:var(--font-d); font-weight:800; font-size:15px; color:#fff; background:linear-gradient(160deg,#4a5a78,#2a3550); border:2px solid rgba(255,255,255,.5); border-radius:9px; padding:1px 10px; box-shadow:var(--shadow-sm); white-space:nowrap; opacity:.98}
.tools{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:8px}
.tbtn.mini{width:40px;height:40px;border-radius:12px}
.tbtn.mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.mini.on{color:#fff;background:linear-gradient(160deg,var(--n2),var(--n));border-color:transparent}
.modes{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap}
.mbtn{flex:1; min-width:150px; display:flex; flex-direction:column; gap:2px; align-items:flex-start; cursor:pointer; padding:12px 15px; border-radius:16px;
  border:2.5px solid var(--line); background:var(--card); color:inherit; box-shadow:var(--shadow-sm); transition:transform .12s, border-color .12s}
.mbtn:active{transform:translateY(1px)}
.mbtn b{font-family:var(--font-d); font-weight:800; font-size:14.5px}
.mbtn span{font-size:12px; font-weight:600; color:var(--sub)}
.mbtn.on{border-color:var(--n); box-shadow:0 0 0 3px rgba(232,70,47,.16)}
.panel{margin-top:16px; background:var(--card); border:2.5px solid var(--line); border-radius:22px; box-shadow:var(--shadow-sm); padding:18px 20px}
.panel h2{font-family:var(--font-d); font-weight:800; font-size:17px; margin:0 0 8px}
.panel p{margin:0; color:var(--sub); font-size:13.5px; line-height:1.6; font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.lg-n i{background:var(--n)} .lg-s i{background:var(--s)}
footer{margin-top:26px;text-align:center;color:var(--sub);font-size:13px;font-weight:700}
footer a{color:var(--n);font-weight:800;text-decoration:none}
:root[data-theme="gelap"] footer a{color:var(--n2)}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }
</script>
</head>
<body>
  <div class="bar">
    <a class="ic" href="/magnet/" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title"><span class="b"><svg viewBox="0 0 24 24"><path d="M5 4h4v6a3 3 0 0 0 6 0V4h4v6a8 8 0 0 1-16 0V4z"/></svg></span> Medan Magnet <span class="tag">3D</span></div>
    <div class="spacer"></div>
    <button class="tbtn" id="theme" type="button" aria-label="Mode terang atau gelap"></button>
  </div>

  <div class="wrap">
    <div class="stage" id="stage">
      <div class="tools">
        <button class="tbtn mini" id="rot" type="button" title="Putar otomatis" aria-label="Putar otomatis"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      </div>
      <div class="hint">Seret untuk memutar · cubit/scroll untuk zoom</div>
    </div>

    <div class="modes" id="modes">
      <button class="mbtn on" data-mode="single"><b>Magnet Tunggal</b><span>Satu batang N–S + garis gaya</span></button>
      <button class="mbtn" data-mode="attract"><b>Tarik-menarik</b><span>Kutub berbeda (N–S)</span></button>
      <button class="mbtn" data-mode="repel"><b>Tolak-menolak</b><span>Kutub sama (N–N)</span></button>
    </div>

    <div class="panel">
      <h2 id="p-title">Magnet Tunggal</h2>
      <p id="p-text"></p>
      <div class="legend">
        <span class="lg-n"><i></i>Kutub Utara (N)</span>
        <span class="lg-s"><i></i>Kutub Selatan (S)</span>
      </div>
    </div>
  </div>

<script>
(function(){ var KEY='adindautami-theme',t='terang'; try{t=localStorage.getItem(KEY)||'terang'}catch(e){} document.documentElement.setAttribute('data-theme',t); })();
</script>
<script type="module" src="/js/magnet3d.js?v=1"></script>
</body>
</html>
